<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="920px" version="1.1" viewBox="0 0 1460 920" width="1460px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Vyukov MPMC — the gap between claim and publication</title><desc>Three slot states with only two numbered milestones: CAS claim (1) and release publication (2).</desc><defs /><rect fill="#FEFEFC" height="920" rx="0" ry="0" stroke="none" stroke-width="1" width="1460" x="0" y="0" /><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="33" font-weight="500" text-anchor="start" x="70" y="79">Vyukov MPMC — the progress gap</text><text xml:space="preserve" fill="#667586" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="20" font-weight="400" text-anchor="start" x="71" y="119">A successful claim is not the same as a published element.</text><path d="M70,149 H1390" fill="none" stroke="#DEE4EA" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" /><rect fill="#F6F8FA" height="68" rx="11" ry="11" stroke="none" stroke-width="1" width="1320" x="70" y="171" /><rect fill="#A56B2D" height="68" rx="2" ry="2" stroke="none" stroke-width="1" width="4" x="70" y="171" /><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="20" font-weight="400" text-anchor="start" x="94" y="213">If the producer pauses between (1) and (2), the slot is claimed but not readable.</text><rect fill="#F4F8FE" height="154" rx="15" ry="15" stroke="#C8D9F0" stroke-width="1.4" width="365" x="70" y="311" /><text xml:space="preserve" fill="#3C78C6" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="500" text-anchor="middle" x="252.5" y="365">Ready for producer</text><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="20" font-weight="400" text-anchor="middle" x="252.5" y="411">seq = p</text><rect fill="#FEF9F0" height="154" rx="15" ry="15" stroke="#EACFA6" stroke-width="1.4" width="366" x="554" y="311" /><text xml:space="preserve" fill="#A56B2D" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="500" text-anchor="middle" x="737.0" y="365">Claimed, not published</text><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="20" font-weight="400" text-anchor="middle" x="737.0" y="411">tail = p + 1, seq = p</text><rect fill="#F2FAF8" height="154" rx="15" ry="15" stroke="#B7DCD4" stroke-width="1.4" width="346" x="1044" y="311" /><text xml:space="preserve" fill="#278579" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="500" text-anchor="middle" x="1217.0" y="365">Readable by consumer</text><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="20" font-weight="400" text-anchor="middle" x="1217.0" y="411">seq = p + 1</text><text xml:space="preserve" fill="#3C78C6" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="500" text-anchor="middle" x="493" y="353">(1)</text><text xml:space="preserve" fill="#667586" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="middle" x="493" y="378">CAS</text><path d="M449,402 L540,402 M531,396 L540,402 L531,408" fill="none" stroke="#3C78C6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" /><text xml:space="preserve" fill="#278579" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="500" text-anchor="middle" x="996" y="353">(2)</text><text xml:space="preserve" fill="#667586" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="middle" x="996" y="378">release</text><path d="M931,402 L1030,402 M1021,396 L1030,402 L1021,408" fill="none" stroke="#278579" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" /><text xml:space="preserve" fill="#A56B2D" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" text-anchor="middle" x="737" y="499">PAUSE HERE: progress can depend on this producer resuming</text><path d="M70,538 H1390" fill="none" stroke="#DEE4EA" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" /><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="500" text-anchor="start" x="72" y="578">Producer code · relevant lines only</text><text xml:space="preserve" fill="#667586" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="17" font-weight="400" text-anchor="end" x="1390" y="578">after seq == p</text><rect fill="#F4F8FE" height="67" rx="8" ry="8" stroke="none" stroke-width="1" width="650" x="94" y="600" /><rect fill="#F2FAF8" height="39" rx="8" ry="8" stroke="none" stroke-width="1" width="650" x="94" y="771" /><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" text-anchor="start" x="115" y="624">if (!tail_.compare_exchange_weak(</text><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" text-anchor="start" x="115" y="656">        p, next, std::memory_order_relaxed))</text><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" text-anchor="start" x="115" y="688">    continue;</text><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" text-anchor="start" x="115" y="752">slot.data = std::move(data);</text><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" text-anchor="start" x="115" y="797">slot.seq.store(next, std::memory_order_release);</text><path d="M758,638 H829" fill="none" stroke="#3C78C6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /><text xml:space="preserve" fill="#3C78C6" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="500" text-anchor="start" x="853" y="646">(1)</text><text xml:space="preserve" fill="#667586" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="17" font-weight="400" text-anchor="start" x="920" y="645">claim logical position p</text><path d="M758,790 H829" fill="none" stroke="#278579" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /><text xml:space="preserve" fill="#278579" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="500" text-anchor="start" x="853" y="798">(2)</text><text xml:space="preserve" fill="#667586" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="17" font-weight="400" text-anchor="start" x="920" y="798">publish seq = p + 1</text><path d="M70,842 H1390" fill="none" stroke="#DEE4EA" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" /><text xml:space="preserve" fill="#26313F" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="500" text-anchor="start" x="72" y="878">Why not lock-free?</text><text xml:space="preserve" fill="#667586" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" text-anchor="start" x="340" y="878">A stalled owner can prevent other threads from completing operations.</text></svg>